<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyeSense - Gestion des contacts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 28px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .card {
            background: rgba(26, 31, 58, 0.9);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #00d4ff;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #b0b9c1;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.3);
        }
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        .btn-danger:hover {
            background: #ff5252;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        .contact-list {
            list-style: none;
        }
        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #00d4ff;
        }
        .contact-item .info {
            flex: 1;
        }
        .contact-item .name {
            font-weight: bold;
            font-size: 16px;
        }
        .contact-item .email {
            font-size: 13px;
            color: #b0b9c1;
        }
        .contact-item .actions {
            display: flex;
            gap: 8px;
        }
        .empty-message {
            text-align: center;
            color: #7b8fa3;
            padding: 30px 0;
        }
        .empty-message .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .badge {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .flex {
            display: flex;
            gap: 10px;
        }
        .mt-10 {
            margin-top: 10px;
        }
        .mb-10 {
            margin-bottom: 10px;
        }
        .text-center {
            text-align: center;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            font-size: 14px;
            z-index: 1000;
            display: none;
            max-width: 90%;
        }
        .toast.success {
            border-left: 4px solid #26d07c;
        }
        .toast.error {
            border-left: 4px solid #ff6b6b;
        }
        @media (max-width: 480px) {
            header h1 {
                font-size: 22px;
            }
            .contact-item {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .contact-item .actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📇 Contacts d'urgence</h1>
            <button class="back-btn" onclick="window.location.href='/'">← Retour</button>
        </header>

        <div class="toast" id="toast"></div>

        <div class="card">
            <h2>➕ Ajouter un contact</h2>
            <div class="form-group">
                <label>Nom du contact</label>
                <input type="text" id="contactName" placeholder="Ex: Maman" />
            </div>
            <div class="form-group">
                <label>Adresse email</label>
                <input type="email" id="contactEmail" placeholder="exemple@email.com" />
            </div>
            <button class="btn btn-primary" onclick="addContact()">
                ➕ Ajouter le contact
            </button>
        </div>

        <div class="card">
            <h2>📋 Mes contacts d'urgence</h2>
            <div id="contactList">
                <div class="empty-message">
                    <div class="icon">📭</div>
                    <p>Aucun contact d'urgence</p>
                    <p style="font-size:12px;color:#7b8fa3;">Ajoutez des contacts pour recevoir des alertes</p>
                </div>
            </div>
        </div>

        <div class="card text-center">
            <div class="flex" style="justify-content:center; gap:10px;">
                <button class="btn btn-primary" onclick="sendTestAlert()">
                    📧 Tester l'alerte
                </button>
                <button class="btn btn-danger" onclick="clearAllContacts()">
                    🗑️ Tout supprimer
                </button>
            </div>
        </div>
    </div>

    <script src="contacts.js"></script>
</body>
</html>
